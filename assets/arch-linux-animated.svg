<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <linearGradient id="arch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7aa2f7"></stop>
      <stop offset="50%" stop-color="#2ac3de"></stop>
      <stop offset="100%" stop-color="#bb9af7"></stop>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <rect width="300" height="300" rx="28" fill="#16161e"></rect>

  <g fill="url(#arch)" filter="url(#glow)">
    <path d="M150 30 L260 265 L210 265 L150 125 L90 265 L40 265 Z">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="3s" repeatCount="indefinite"></animate>
    </path>
    <path d="M150 165 L177 225 L150 211 L123 225 Z" fill="#16161e"></path>
  </g>

  <circle cx="150" cy="150" r="125" fill="none" stroke="#7aa2f7" stroke-opacity=".2" stroke-width="2" stroke-dasharray="8 12">
    <animateTransform attributeName="transform" type="rotate" from="0 150 150" to="360 150 150" dur="30s" repeatCount="indefinite"></animateTransform>
  </circle>

  <text x="150" y="285" text-anchor="middle" fill="#c0caf5" font-family="monospace" font-size="11" letter-spacing="3">I USE ARCH BTW</text>
</svg>